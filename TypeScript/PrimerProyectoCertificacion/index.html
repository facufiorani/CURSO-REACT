<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StudySpark · Tarjetas Didácticas</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>

<body>
    <div class="app">
        <header class="app-header">
            <h1>✨ StudySpark</h1>
            <p>Repasá tus tarjetas y aprendé jugando</p>
        </header>

        <main class="layout">
            <section class="study-area">
                <div class="stage">
                    <div id="flashcard" class="flashcard">
                        <div class="flashcard-inner">
                            <div class="flashcard-face flashcard-front">
                                <span class="face-label">Pregunta</span>
                                <p id="front-display" class="face-text"></p>
                            </div>
                            <div class="flashcard-face flashcard-back">
                                <span class="face-label">Respuesta</span>
                                <p id="back-display" class="face-text"></p>
                            </div>
                        </div>
                    </div>
                    <p class="hint">Tocá la tarjeta para voltearla 👆</p>
                </div>

                <div class="deck-actions">
                    <button id="delete-btn" class="btn btn-danger" type="button">
                        🗑️ Eliminar tarjeta actual
                    </button>
                </div>

                <div class="deck">
                    <h2>Tu mazo</h2>
                    <div id="deck-list" class="deck-list"></div>
                </div>
            </section>

            <aside class="form-area">
                <h2>Agregar tarjeta</h2>
                <form id="entry-form" novalidate>
                    <label for="front-text">Pregunta</label>
                    <textarea id="front-text" placeholder="Escribí la pregunta..."></textarea>

                    <label for="back-text">Respuesta</label>
                    <textarea id="back-text" placeholder="Escribí la respuesta..."></textarea>

                    <p id="form-error" class="form-error" role="alert"></p>

                    <button type="submit" class="btn btn-primary">
                        ➕ Agregar tarjeta
                    </button>
                </form>
            </aside>
        </main>
    </div>

    <script src="index.ts"></script>
</body>

</html>
