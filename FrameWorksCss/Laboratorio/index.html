<!DOCTYPE html>
<html lang="en">

<head>

    <title>Music Shopping Cart Page</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body>
    <div id="shopping-cart-container" class="flex flex-col lg:flex-row">

            <div class="card">
                <h2 class="text-xl">Product 2</h2>
                <div class="quantity">Numero Items:</div>
                <div class="price">Precio:</div>
                <button class="remove-button bg-red-500 hover:bg-red-700">Remove</button>
            </div>
            <div class="card">

        </div>

            <div id='total-amount'>
                Total:
            </div>
            <a href="#"
